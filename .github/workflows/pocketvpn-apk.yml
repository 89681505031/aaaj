name: Build PocketVPN APK

on:
  push:
    branches:
      - pocketvpn-build-v07

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Rebuild project archive
        run: |
          cat pocketvpn-build/source.part* | base64 -d > PocketVPN-source-v0.6.zip
          unzip -q PocketVPN-source-v0.6.zip
          test -f PocketVPN/app/build.gradle

      - name: Apply v0.7 Android patch
        run: patch -p0 < pocketvpn-build/v07-android.patch

      - name: Build debug APK
        working-directory: PocketVPN
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp PocketVPN/app/build/outputs/apk/debug/app-debug.apk output/PocketVPN-v0.7-debug.apk
          ls -lh output/PocketVPN-v0.7-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketVPN-v0.7-debug-apk
          path: output/PocketVPN-v0.7-debug.apk
          if-no-files-found: error
          retention-days: 7
